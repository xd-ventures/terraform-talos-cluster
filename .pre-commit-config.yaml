repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # OpenTofu / Terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--minimum-failure-severity=warning
      # Input/output/requirements tables injected into each README between the
      # TF_DOCS markers; CI runs this hook, so a stale README fails the build
      # (registry-rendered docs never drift — ADR-0016 decision 5).
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=false
          - --args=--config=.terraform-docs.yml

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['-x']

  # License header compliance (replicated from the source repo — ADR-0016
  # decision 1 license continuity)
  - repo: local
    hooks:
      - id: license-eye
        name: License header check (SPDX)
        entry: license-eye header check
        language: golang
        additional_dependencies: ['github.com/apache/skywalking-eyes/cmd/license-eye@v0.8.0']
        types_or: [text]
        files: '\.(tf|py|sh|tftpl|yml|yaml|tftest\.hcl)$|^Makefile$'
        pass_filenames: false
